<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mock Test Fine Arts (Painting)</title>
    <!-- Google Fonts & Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-white">

    <!-- Top App Bar -->
    <header class="sticky top-0 z-40 bg-white/85 backdrop-blur-md border-b border-slate-100 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-2.5">
            <div class="w-9 h-9 bg-brand-600 rounded-xl flex items-center justify-center text-white font-bold shadow-lg shadow-brand-500/30">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            </div>
            <div>
                <h1 id="app-title" class="font-bold text-sm tracking-tight text-slate-900 leading-tight">Mock Test Fine Arts (Painting)</h1>
                <p id="app-subtitle" class="text-[10px] font-medium text-brand-600">Session 2026-27</p>
            </div>
        </div>
        <div id="header-action"></div>
    </header>

    <!-- Main Dynamic Container -->
    <main id="app-main" class="flex-1 max-w-md w-full mx-auto p-4 pb-20">
        <!-- Loading State -->
        <div id="loading-view" class="flex flex-col items-center justify-center py-24 space-y-4">
            <div class="w-10 h-10 border-4 border-brand-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-sm font-medium text-slate-500 animate-pulse">Loading App Data...</p>
        </div>
        
        <!-- Error State -->
        <div id="error-view" class="hidden flex flex-col items-center justify-center py-20 text-center px-6">
            <div class="w-16 h-16 bg-rose-100 text-rose-500 rounded-2xl flex items-center justify-center text-xl mb-4 font-bold">!</div>
            <h3 class="font-bold text-lg text-slate-800">Could not load data</h3>
            <p id="error-message" class="text-xs text-slate-500 mt-1 mb-6">Please check your internet connection or Google Sheet URL.</p>
            <button onclick="loadData()" class="bg-brand-600 text-white font-semibold px-6 py-2.5 rounded-xl text-sm shadow-md active:scale-95 transition-transform">Retry</button>
        </div>

        <!-- Dynamic Views Injected Here -->
        <div id="view-container"></div>
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center border-t border-slate-100 bg-white text-xs text-slate-400">
        Designed & Developed by <span class="font-semibold text-slate-600">Darpan Sukla</span>
    </footer>

    <!-- App Logic Scripts -->
    <script>
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRc5oTMfGfKrBdfZOqbWIvYbhuNa0DGIQ_6ocYoj60qLYotfp8qzmjLggU9mg3NieQX9reYPYO8f64i/pub?gid=0&single=true&output=csv";

        let globalData = [];
        let currentView = 'classes'; 
        let studentName = "";
        let selectedClass = null;
        let selectedSet = null;
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let userAnswers = {};
        let currentStreak = 0;
        let maxStreakAchieved = 0;
        let audioCtx = null;

        // Video Lesson State variables
        let videoLessonsList = [];
        let currentVideoIndex = 0;
        let ytPlayer = null;
        let currentQuality = 'default';

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function parseCSV(text) {
            let lines = text.trim().split('\n');
            let result = [];
            let headers = parseCSVLine(lines[0]);

            for (let i = 1; i < lines.length; i++) {
                let obj = {};
                let currentline = parseCSVLine(lines[i]);
                if (currentline.length === headers.length) {
                    for (let j = 0; j < headers.length; j++) {
                        obj[headers[j].trim()] = currentline[j].trim();
                    }
                    result.push(obj);
                }
            }
            return result;
        }

        function parseCSVLine(text) {
            let ret = [];
            let inQuotes = false;
            let entry = '';
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (c === '"') {
                    inQuotes = !inQuotes;
                } else if (c === ',' && !inQuotes) {
                    ret.push(entry);
                    entry = '';
                } else {
                    entry += c;
                }
            }
            ret.push(entry);
            return ret;
        }

        function cleanSetNumber(val) {
            if(!val) return '1';
            return val.toString().replace(/set\s*-?/gi, '').trim();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function extractYouTubeID(url) {
            if (!url) return '';
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            let match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : url;
        }

        async function loadData() {
            document.getElementById('loading-view').classList.remove('hidden');
            document.getElementById('error-view').classList.add('hidden');
            document.getElementById('view-container').innerHTML = '';

            try {
                let response = await fetch(SHEET_CSV_URL);
                let dataText = await response.text();
                globalData = parseCSV(dataText);

                if(globalData.length === 0) throw new Error("No data parsed");

                document.getElementById('loading-view').classList.add('hidden');
                renderClassesView();
            } catch (err) {
                console.error(err);
                document.getElementById('loading-view').classList.add('hidden');
                document.getElementById('error-view').classList.remove('hidden');
            }
        }

        // View 1: Classes Grid Screen
        function renderClassesView() {
            currentView = 'classes';
            document.getElementById('app-title').innerText = "Mock Test Fine Arts (Painting)";
            document.getElementById('app-subtitle').classList.remove('hidden');
            document.getElementById('header-action').innerHTML = '';

            let classesMap = {};
            globalData.forEach(row => {
                let cls = row['Class'] || 'General';
                if (!classesMap[cls]) classesMap[cls] = 0;
                classesMap[cls]++;
            });

            const classThemes = [
                { bg: 'bg-emerald-50', text: 'text-emerald-600', hoverBg: 'group-hover:bg-emerald-600', hoverBorder: 'hover:border-emerald-300', icon: `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.5a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0zm4 0a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0zm2 4a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0z"></path></svg>` },
                { bg: 'bg-blue-50', text: 'text-blue-600', hoverBg: 'group-hover:bg-blue-600', hoverBorder: 'hover:border-blue-300', icon: `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>` },
                { bg: 'bg-amber-50', text: 'text-amber-600', hoverBg: 'group-hover:bg-amber-600', hoverBorder: 'hover:border-amber-300', icon: `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>` },
                { bg: 'bg-purple-50', text: 'text-purple-600', hoverBg: 'group-hover:bg-purple-600', hoverBorder: 'hover:border-purple-300', icon: `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>` },
                { bg: 'bg-rose-50', text: 'text-rose-600', hoverBg: 'group-hover:bg-rose-600', hoverBorder: 'hover:border-rose-300', icon: `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h14a2 2 0 012 2v10a2 2 0 01-2 2H4a2 2 0 01-2-2z"></path></svg>` }
            ];

            let html = `
                <div class="mb-5 text-center">
                    <h2 class="text-lg font-bold text-slate-900">Select Class</h2>
                </div>
                <div class="grid grid-cols-2 gap-4">
            `;

            let index = 0;
            for (let cls in classesMap) {
                let theme = classThemes[index % classThemes.length];
                html += `
                    <div onclick="initAudio(); selectClass('${cls}')" class="bg-white aspect-square rounded-3xl border border-slate-100 shadow-sm active:scale-95 transition-all flex flex-col items-center justify-center p-4 cursor-pointer group ${theme.hoverBorder} hover:shadow-md">
                        <div class="w-14 h-14 ${theme.bg} ${theme.text} rounded-2xl flex items-center justify-center font-bold mb-3 ${theme.hoverBg} group-hover:text-white transition-colors shadow-inner">
                            ${theme.icon}
                        </div>
                        <h3 class="font-bold text-slate-800 text-sm text-center tracking-tight">${cls}</h3>
                    </div>
                `;
                index++;
            }
            html += `</div>`;
            document.getElementById('view-container').innerHTML = html;
        }

        function selectClass(cls) {
            selectedClass = cls;
            renderClassHubView();
        }

        // View 1.5: Class Hub
        function renderClassHubView() {
            currentView = 'classHub';
            document.getElementById('app-title').innerText = selectedClass;
            document.getElementById('app-subtitle').classList.add('hidden');
            document.getElementById('header-action').innerHTML = `
                <button onclick="renderClassesView()" class="text-xs font-semibold px-3 py-1.5 bg-slate-100 text-slate-600 rounded-xl active:scale-95 transition-transform">Back</button>
            `;

            let html = `
                <div class="mb-6 text-center">
                    <h2 class="text-lg font-bold text-slate-900">Choose Section</h2>
                    <p class="text-xs text-slate-500 mt-0.5">Explore video lessons or practice quiz sets</p>
                </div>

                <div class="space-y-4">
                    <div onclick="renderVideoCategoriesView()" class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm active:scale-[0.98] transition-all flex items-center space-x-4 cursor-pointer group hover:border-brand-300 hover:shadow-md">
                        <div class="w-14 h-14 bg-rose-50 text-rose-600 rounded-2xl flex items-center justify-center font-bold group-hover:bg-rose-600 group-hover:text-white transition-colors flex-shrink-0 shadow-inner">
                            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        <div>
                            <h3 class="font-bold text-slate-900 text-base">Video Lessons</h3>
                            <p class="text-xs text-slate-500 mt-0.5">Watch video lectures and tutorials</p>
                        </div>
                    </div>

                    <div onclick="renderSetsView()" class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm active:scale-[0.98] transition-all flex items-center space-x-4 cursor-pointer group hover:border-brand-300 hover:shadow-md">
                        <div class="w-14 h-14 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center font-bold group-hover:bg-emerald-600 group-hover:text-white transition-colors flex-shrink-0 shadow-inner">
                            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                        </div>
                        <div>
                            <h3 class="font-bold text-slate-900 text-base">Quiz Sets</h3>
                            <p class="text-xs text-slate-500 mt-0.5">Test your knowledge with mock sets</p>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('view-container').innerHTML = html;
        }

        // --- VIDEO LESSONS VIEWS ---
        function renderVideoCategoriesView() {
            currentView = 'videoCategories';
            document.getElementById('app-title').innerText = `${selectedClass} - Videos`;
            document.getElementById('app-subtitle').classList.add('hidden');
            document.getElementById('header-action').innerHTML = `
                <button onclick="renderClassHubView()" class="text-xs font-semibold px-3 py-1.5 bg-slate-100 text-slate-600 rounded-xl active:scale-95 transition-transform">Back</button>
            `;

            let categoriesMap = {};
            globalData.filter(r => r['Class'] === selectedClass && r['Option A'] && r['Option A'].includes('http')).forEach(row => {
                let cat = row['Category'] || 'General Videos';
                if (!categoriesMap[cat]) categoriesMap[cat] = 0;
                categoriesMap[cat]++;
            });

            let html = `
                <div class="mb-5 text-center">
                    <h2 class="text-lg font-bold text-slate-900">Video Categories</h2>
                    <p class="text-xs text-slate-500 mt-0.5">Select a category to view serial lessons</p>
                </div>
                <div class="space-y-3">
            `;

            let hasVideos = false;
            for (let cat in categoriesMap) {
                hasVideos = true;
                html += `
                    <div onclick="selectVideoCategory('${cat}')" class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm active:scale-[0.98] transition-all flex items-center justify-between cursor-pointer group hover:border-brand-300">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 bg-rose-50 text-rose-600 rounded-xl flex items-center justify-center font-bold group-hover:bg-rose-600 group-hover:text-white transition-colors">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path></svg>
                            </div>
                            <div>
                                <h3 class="font-bold text-slate-900 text-sm">${cat}</h3>
                                <p class="text-[11px] text-slate-500">${categoriesMap[cat]} Lessons</p>
                            </div>
                        </div>
                        <svg class="w-5 h-5 text-slate-400 group-hover:text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </div>
                `;
            }

            if (!hasVideos) {
                html += `
                    <div class="text-center py-12 bg-white rounded-3xl border border-slate-100 p-6">
                        <p class="text-xs text-slate-500">No video lessons available for this class yet.</p>
                    </div>
                `;
            }

            html += `</div>`;
            document.getElementById('view-container').innerHTML = html;
        }

        function selectVideoCategory(category) {
            videoLessonsList = globalData.filter(r => r['Class'] === selectedClass && (r['Category'] || 'General Videos') === category && r['Option A'] && r['Option A'].includes('http'));
            renderVideoSerialListView(category);
        }

        function renderVideoSerialListView(category) {
            currentView = 'videoSerialList';
            document.getElementById('app-title').innerText = category;
            document.getElementById('app-subtitle').classList.add('hidden');
            document.getElementById('header-action').innerHTML = `
                <button onclick="renderVideoCategoriesView()" class="text-xs font-semibold px-3 py-1.5 bg-slate-100 text-slate-600 rounded-xl active:scale-95">Categories</button>
            `;

            let html = `
                <div class="mb-4 text-center">
                    <h2 class="text-lg font-bold text-slate-900">Serial Lessons List</h2>
                    <p class="text-xs text-slate-500 mt-0.5">Tap any lesson title to play in fullscreen landscape</p>
                </div>
                <div class="space-y-3">
            `;

            videoLessonsList.forEach((lesson, index) => {
                html += `
                    <div onclick="playVideoLessonAtIndex(${index})" class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm active:scale-[0.98] transition-all flex items-center space-x-3 cursor-pointer group hover:border-brand-300">
                        <div class="w-9 h-9 bg-rose-50 text-rose-600 rounded-xl flex items-center justify-center font-bold text-xs flex-shrink-0 group-hover:bg-rose-600 group-hover:text-white transition-colors">
                            ${index + 1}
                        </div>
                        <div class="flex-1">
                            <h3 class="font-bold text-slate-900 text-sm leading-snug">${lesson['Questions']}</h3>
                            <p class="text-[10px] text-slate-400 mt-0.5">Lesson ${index + 1} of ${videoLessonsList.length}</p>
                        </div>
                        <svg class="w-5 h-5 text-slate-400 group-hover:text-brand-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path></svg>
                    </div>
                `;
            });

            html += `</div>`;
            document.getElementById('view-container').innerHTML = html;
        }

        function playVideoLessonAtIndex(index) {
            currentVideoIndex = index;
            renderVideoPlayerView();

            // Automatically request fullscreen and landscape orientation lock on user action
            let playerElement = document.getElementById('video-fullscreen-wrapper');
            if (playerElement) {
                if (playerElement.requestFullscreen) {
                    playerElement.requestFullscreen().catch(() => {});
                } else if (playerElement.webkitRequestFullscreen) {
                    playerElement.webkitRequestFullscreen();
                }
            }

            if (screen.orientation && typeof screen.orientation.lock === 'function') {
                screen.orientation.lock('landscape').catch(() => {});
            }
        }

        function renderVideoPlayerView() {
            currentView = 'videoPlayer';
            let currentLesson = videoLessonsList[currentVideoIndex];
            let videoId = extractYouTubeID(currentLesson['Option A']);
            let categoryName = currentLesson['Category'] || 'Video Lesson';

            document.getElementById('app-title').innerText = `Lesson ${currentVideoIndex + 1}/${videoLessonsList.length}`;
            document.getElementById('app-subtitle').classList.add('hidden');
            document.getElementById('header-action').innerHTML = `
                <button onclick="renderVideoSerialListView('${categoryName}')" class="text-xs font-semibold px-3 py-1.5 bg-slate-100 text-slate-600 rounded-xl active:scale-95">Lessons</button>
            `;

            let html = `
                <div class="mb-3 text-xs text-slate-500 flex justify-between items-center px-1">
                    <span class="font-semibold text-rose-600">${categoryName}</span>
                    <span class="bg-rose-50 text-rose-700 font-bold px-2 py-0.5 rounded-full text-[10px]">Locked Controls</span>
                </div>

                <!-- Video Title Card -->
                <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm mb-4">
                    <h3 class="font-bold text-slate-900 text-base leading-snug">${currentLesson['Questions']}</h3>
                </div>

                <!-- Fullscreen Landscape Container Wrapper -->
                <div id="video-fullscreen-wrapper" class="bg-black rounded-3xl overflow-hidden shadow-lg mb-4 aspect-video relative flex items-center justify-center">
                    <div id="youtube-iframe-container" class="w-full h-full absolute inset-0 pointer-events-none"></div>

                    <!-- Quality Control Selector Button Floating Overlay -->
                    <div class="absolute top-3 right-3 z-30">
                        <div class="relative">
                            <button onclick="toggleQualityDropdown()" class="bg-slate-900/80 backdrop-blur-md text-white px-2.5 py-1.5 rounded-xl text-[11px] font-bold flex items-center space-x-1.5 shadow-md active:scale-95 transition-transform border border-white/10">
                                <svg class="w-3.5 h-3.5 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
                                <span id="quality-label">Quality</span>
                            </button>
                            
                            <!-- Dropdown Menu -->
                            <div id="quality-dropdown" class="hidden absolute right-0 mt-2 w-28 bg-slate-900/95 backdrop-blur-md rounded-2xl shadow-xl border border-white/10 overflow-hidden py-1 z-40 text-xs">
                                <button onclick="setVideoQuality('hd1080')" class="w-full text-left px-3 py-2 text-slate-300 hover:bg-white/10 hover:text-white font-medium">1080p</button>
                                <button onclick="setVideoQuality('hd720')" class="w-full text-left px-3 py-2 text-slate-300 hover:bg-white/10 hover:text-white font-medium">720p</button>
                                <button onclick="setVideoQuality('large')" class="w-full text-left px-3 py-2 text-slate-300 hover:bg-white/10 hover:text-white font-medium">480p</button>
                                <button onclick="setVideoQuality('medium')" class="w-full text-left px-3 py-2 text-slate-300 hover:bg-white/10 hover:text-white font-medium">360p</button>
                                <button onclick="setVideoQuality('default')" class="w-full text-left px-3 py-2 text-slate-300 hover:bg-white/10 hover:text-white font-medium border-t border-white/10">Auto</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action Controls (Close / Next Lesson Options) -->
                <div class="space-y-3">
                    <button onclick="renderVideoSerialListView('${categoryName}')" class="w-full bg-slate-100 text-slate-700 font-semibold py-3.5 rounded-2xl text-sm active:scale-[0.98] transition-transform">
                        Close Video & Back to List
                    </button>
                    ${currentVideoIndex < videoLessonsList.length - 1 ? `
                        <button onclick="playNextVideoLesson()" class="w-full bg-brand-600 text-white font-semibold py-3.5 rounded-2xl text-sm shadow-lg shadow-brand-500/25 active:scale-[0.98] transition-transform">
                            Next Lesson
                        </button>
                    ` : `
                        <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-2xl text-center text-xs font-semibold text-emerald-800">
                            You have completed all lessons in this category!
                        </div>
                    `}
                </div>
            `;
            document.getElementById('view-container').innerHTML = html;

            loadYouTubePlayer(videoId);
        }

        function loadYouTubePlayer(videoId) {
            if (!window.YT) {
                let tag = document.createElement('script');
                tag.src = "https://www.youtube.com/iframe_api";
                let firstScriptTag = document.getElementsByTagName('script')[0];
                firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
                
                window.onYouTubeIframeAPIReady = function() {
                    initYTPlayerInstance(videoId);
                };
            } else {
                initYTPlayerInstance(videoId);
            }
        }

        function initYTPlayerInstance(videoId) {
            if (ytPlayer && typeof ytPlayer.destroy === 'function') {
                ytPlayer.destroy();
            }

            ytPlayer = new YT.Player('youtube-iframe-container', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 1,
                    'modestbranding': 1,
                    'rel': 0,
                    'iv_load_policy': 3,
                    'showinfo': 0
                },
                events: {
                    'onReady': function(event) {
                        event.target.playVideo();
                    },
                    'onStateChange': function(event) {
                        if (event.data === YT.PlayerState.PAUSED) {
                            event.target.playVideo();
                        }
                    }
                }
            });
        }

        function toggleQualityDropdown() {
            let dropdown = document.getElementById('quality-dropdown');
            if(dropdown) {
                dropdown.classList.toggle('hidden');
            }
        }

        function setVideoQuality(qualityLevel) {
            if (ytPlayer && typeof ytPlayer.setPlaybackQuality === 'function') {
                ytPlayer.setPlaybackQuality(qualityLevel);
                currentQuality = qualityLevel;
                let displayTxt = qualityLevel === 'hd1080' ? '1080p' : qualityLevel === 'hd720' ? '720p' : qualityLevel === 'large' ? '480p' : qualityLevel === 'medium' ? '360p' : 'Auto';
                document.getElementById('quality-label').innerText = displayTxt;
            }
            toggleQualityDropdown();
        }

        function playNextVideoLesson() {
            if (currentVideoIndex < videoLessonsList.length - 1) {
                currentVideoIndex++;
                renderVideoPlayerView();
            }
        }

        // --- QUIZ SETS VIEWS ---
        function renderSetsView() {
            currentView = 'sets';
            document.getElementById('app-title').innerText = selectedClass;
            document.getElementById('app-subtitle').classList.add('hidden');
            document.getElementById('header-action').innerHTML = `
                <button onclick="renderClassHubView()" class="text-xs font-semibold px-3 py-1.5 bg-slate-100 text-slate-600 rounded-xl active:scale-95 transition-transform">Back</button>
            `;

            let setsMap = {};
            globalData.filter(r => r['Class'] === selectedClass && (!r['Option A'] || !r['Option A'].includes('http') || r['Questions'] && !r['Option A'])).forEach(row => {
                let rawSet = row['Set No.'] || '1';
                let cleanNum = cleanSetNumber(rawSet);
                if (!setsMap[cleanNum]) setsMap[cleanNum] = rawSet; 
            });

            const setThemes = [
                { bg: 'bg-emerald-50', text: 'text-emerald-600', hoverBg: 'group-hover:bg-emerald-600', hoverBorder: 'hover:border-emerald-300', subText: 'text-emerald-600' },
                { bg: 'bg-blue-50', text: 'text-blue-600', hoverBg: 'group-hover:bg-blue-600', hoverBorder: 'hover:border-blue-300', subText: 'text-blue-600' },
                { bg: 'bg-amber-50', text: 'text-amber-600', hoverBg: 'group-hover:bg-amber-600', hoverBorder: 'hover:border-amber-300', subText: 'text-amber-600' },
                { bg: 'bg-purple-50', text: 'text-purple-600', hoverBg: 'group-hover:bg-purple-600', hoverBorder: 'hover:border-purple-300', subText: 'text-purple-600' },
                { bg: 'bg-rose-50', text: 'text-rose-600', hoverBg: 'group-hover:bg-rose-600', hoverBorder: 'hover:border-rose-300', subText: 'text-rose-600' },
                { bg: 'bg-cyan-50', text: 'text-cyan-600', hoverBg: 'group-hover:bg-cyan-600', hoverBorder: 'hover:border-cyan-300', subText: 'text-cyan-600' }
            ];

            let html = `
                <div class="mb-5 text-center">
                    <h2 class="text-lg font-bold text-slate-900">Available Quiz Sets</h2>
                    <p class="text-xs text-slate-500 mt-0.5">Select a set to begin practice</p>
                </div>
                <div class="grid grid-cols-2 gap-4">
            `;

            let index = 0;
            for (let cleanNum in setsMap) {
                let rawSetKey = setsMap[cleanNum];
                let storageKey = `highScore_${selectedClass}_Set_${cleanNum}`;
                let bestScore = localStorage.getItem(storageKey);
                let badgeSub = bestScore ? `Best: ${bestScore}` : `Tap to start`;
                let theme = setThemes[index % setThemes.length];

                html += `
                    <div onclick="selectSet('${rawSetKey}')" class="bg-white aspect-square rounded-3xl border border-slate-100 shadow-sm active:scale-95 transition-all flex flex-col items-center justify-center p-3 cursor-pointer group ${theme.hoverBorder} hover:shadow-md relative overflow-hidden">
                        <div class="w-12 h-12 ${theme.bg} ${theme.text} rounded-2xl flex items-center justify-center font-bold text-lg mb-2 ${theme.hoverBg} group-hover:text-white transition-colors shadow-inner">
                            ${cleanNum}
                        </div>
                        <h3 class="font-bold text-slate-800 text-sm text-center tracking-tight">Set ${cleanNum}</h3>
                        <span class="text-[10px] font-semibold ${theme.subText} mt-0.5">${badgeSub}</span>
                    </div>
                `;
                index++;
            }
            html += `</div>`;
            document.getElementById('view-container').innerHTML = html;
        }

        function selectSet(rawSetKey) {
            selectedSet = rawSetKey;
            renderNameInputView();
        }

        function renderNameInputView() {
            currentView = 'nameInput';
            let displaySetNum = cleanSetNumber(selectedSet);
            document.getElementById('app-title').innerText = `Set ${displaySetNum} (${selectedClass})`;
            document.getElementById('app-subtitle').classList.add('hidden');
            document.getElementById('header-action').innerHTML = `
                <button onclick="renderSetsView()" class="text-xs font-semibold px-3 py-1.5 bg-slate-100 text-slate-600 rounded-xl active:scale-95 transition-transform">Back</button>
            `;

            let html = `
                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm mt-4">
                    <div class="text-center mb-6">
                        <h2 class="text-lg font-bold text-slate-900">Enter Your Name</h2>
                        <p class="text-xs text-slate-500 mt-1">Please type your name to start this quiz set.</p>
                    </div>

                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1.5">FULL NAME</label>
                            <input type="text" id="student-name-input" value="${studentName}" oninput="this.value = this.value.toUpperCase(); studentName = this.value;" placeholder="ENTER YOUR FULL NAME" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold text-slate-900 uppercase focus:outline-none focus:border-brand-500 focus:bg-white transition-colors" autocomplete="off">
                        </div>

                        <button onclick="startQuiz()" class="w-full bg-brand-600 text-white font-semibold py-3.5 rounded-2xl text-sm shadow-lg shadow-brand-500/25 active:scale-[0.98] transition-transform">
                            Start Quiz
                        </button>
                    </div>
                </div>
            `;
            document.getElementById('view-container').innerHTML = html;
            
            setTimeout(() => {
                let input = document.getElementById('student-name-input');
                if(input && !studentName) input.focus();
            }, 100);
        }

        function startQuiz() {
            initAudio();
            let input = document.getElementById('student-name-input');
            studentName = input ? input.value.trim().toUpperCase() : "";

            if(!studentName) {
                alert("Please enter your name to start the quiz.");
                if(input) input.focus();
                return;
            }

            let cleanNum = cleanSetNumber(selectedSet);
            let filtered = globalData.filter(r => {
                let rClass = r['Class'] || 'General';
                let rSet = cleanSetNumber(r['Set No.'] || '1');
                let isVideoRow = r['Option A'] && r['Option A'].includes('http');
                return rClass === selectedClass && rSet === cleanNum && !isVideoRow;
            });

            let shuffledQuestions = shuffleArray([...filtered]);
            currentQuestions = shuffledQuestions.map(q => {
                let optionsList = [
                    { originalKey: 'A', text: q['Option A'] },
                    { originalKey: 'B', text: q['Option B'] },
                    { originalKey: 'C', text: q['Option C'] },
                    { originalKey: 'D', text: q['Option D'] }
                ].filter(o => o.text && o.text.trim() !== "");

                shuffleArray(optionsList);

                let randomizedOptions = {};
                let newCorrectKey = '';
                const assignedKeys = ['A', 'B', 'C', 'D'];

                optionsList.forEach((opt, idx) => {
                    let newKey = assignedKeys[idx];
                    randomizedOptions[newKey] = opt.text;
                    if (opt.originalKey === q['Correct Answer']) {
                        newCorrectKey = newKey;
                    }
                });

                return {
                    questionText: q['Questions'],
                    options: randomizedOptions,
                    correctAnswer: newCorrectKey
                };
            });

            currentQuestionIndex = 0;
            userAnswers = {};
            currentStreak = 0;
            maxStreakAchieved = 0;
            renderQuizView();
        }

        function renderQuizView() {
            currentView = 'quiz';
            let q = currentQuestions[currentQuestionIndex];
            let progress = ((currentQuestionIndex + 1) / currentQuestions.length) * 100;
            let currentAnswer = userAnswers[currentQuestionIndex];
            let displaySetNum = cleanSetNumber(selectedSet);

            document.getElementById('app-title').innerText = `Set ${displaySetNum} (${currentQuestionIndex + 1}/${currentQuestions.length})`;
            document.getElementById('app-subtitle').classList.add('hidden');
            document.getElementById('header-action').innerHTML = `
                <button onclick="if(confirm('Quit quiz?')) renderSetsView();" class="text-xs font-semibold px-3 py-1.5 bg-rose-50 text-rose-600 rounded-xl">Quit</button>
            `;

            let html = `
                <div class="mb-3 text-xs text-slate-500 flex justify-between items-center px-1">
                    <span>Student: <strong class="text-slate-800">${studentName}</strong></span>
                    <div class="flex items-center space-x-2">
                        ${currentStreak > 1 ? `<span class="bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded-full text-[10px] animate-pulse-once">Streak: ${currentStreak}</span>` : ''}
                        <span class="font-semibold text-brand-600">${selectedClass}</span>
                    </div>
                </div>

                <div class="w-full bg-slate-200 h-1.5 rounded-full mb-5 overflow-hidden">
                    <div class="bg-brand-600 h-full transition-all duration-300" style="width: ${progress}%"></div>
                </div>

                <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm mb-4">
                    <span class="text-[11px] font-bold text-brand-600 uppercase tracking-wider">Question ${currentQuestionIndex + 1}</span>
                    <h3 class="font-semibold text-slate-900 text-base mt-1.5 leading-snug">${q.questionText}</h3>
                </div>

                <div class="space-y-3 mb-6">
            `;

            for (let key in q.options) {
                let optText = q.options[key];
                let isSelected = currentAnswer === key;
                let btnStyle = isSelected 
                    ? "bg-brand-50 border-brand-500 text-brand-900 font-medium" 
                    : "bg-white border-slate-100 text-slate-700";

                html += `
                    <button onclick="handleOptionClick('${key}')" class="w-full text-left p-4 rounded-2xl border ${btnStyle} shadow-sm active:scale-[0.99] transition-all flex items-center space-x-3">
                        <span class="w-7 h-7 rounded-lg bg-slate-100 flex items-center justify-center text-xs font-bold text-slate-600 flex-shrink-0">${key}</span>
                        <span class="text-sm flex-1">${optText}</span>
                    </button>
                `;
            }

            html += `</div>`;

            html += `
                <div class="flex space-x-3">
                    ${currentQuestionIndex > 0 ? `<button onclick="prevQuestion()" class="flex-1 bg-white border border-slate-200 text-slate-700 font-semibold py-3.5 rounded-2xl text-sm active:scale-[0.98] transition-transform">Prev</button>` : ''}
                    
                    <button onclick="nextQuestion()" class="flex-1 bg-brand-600 text-white font-semibold py-3.5 rounded-2xl text-sm shadow-lg shadow-brand-500/25 active:scale-[0.98] transition-transform">
                        ${currentQuestionIndex === currentQuestions.length - 1 ? 'Submit & Review' : 'Next'}
                    </button>
                </div>
            `;

            document.getElementById('view-container').innerHTML = html;
        }

        function handleOptionClick(optKey) {
            let q = currentQuestions[currentQuestionIndex];
            userAnswers[currentQuestionIndex] = optKey;

            if (navigator.vibrate) {
                navigator.vibrate(40);
            }

            if (optKey === q.correctAnswer) {
                currentStreak++;
                if (currentStreak > maxStreakAchieved) {
                    maxStreakAchieved = currentStreak;
                }
            } else {
                currentStreak = 0;
            }

            renderQuizView();
        }

        function nextQuestion() {
            if (currentQuestionIndex < currentQuestions.length - 1) {
                currentQuestionIndex++;
                renderQuizView();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuizView();
            }
        }

        function showResults() {
            currentView = 'results';
            document.getElementById('app-title').innerText = "Quiz Results & Review";
            document.getElementById('app-subtitle').classList.add('hidden');
            document.getElementById('header-action').innerHTML = `
                <button onclick="renderSetsView()" class="text-xs font-semibold px-3 py-1.5 bg-slate-100 text-slate-600 rounded-xl">Sets</button>
            `;

            let total = currentQuestions.length;
            let score = 0;

            currentQuestions.forEach((q, idx) => {
                if (userAnswers[idx] === q.correctAnswer) {
                    score++;
                }
            });

            let cleanNum = cleanSetNumber(selectedSet);
            let storageKey = `highScore_${selectedClass}_Set_${cleanNum}`;
            let existingBest = parseInt(localStorage.getItem(storageKey)) || 0;
            let isNewBest = false;
            if (score > existingBest) {
                localStorage.setItem(storageKey, score);
                isNewBest = true;
            }

            let percentage = Math.round((score / total) * 100);
            let badgeText = "Gallery Prodigy";
            if (percentage === 100) badgeText = "Master Artist";
            else if (percentage >= 80) badgeText = "Prodigy Painter";
            else if (percentage >= 50) badgeText = "Rising Star";
            else badgeText = "Sketching Potential";

            let html = `
                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm text-center mb-6 relative">
                    ${isNewBest ? '<span class="absolute top-4 right-4 bg-amber-100 text-amber-800 text-[10px] font-bold px-2.5 py-1 rounded-full">New Personal Best</span>' : ''}
                    <span class="inline-block text-[11px] font-bold bg-brand-50 text-brand-700 px-3 py-1 rounded-full mb-3">${studentName}</span>
                    <div class="w-16 h-16 bg-brand-50 text-brand-600 rounded-2xl flex items-center justify-center text-xl mx-auto mb-3 font-bold">
                        ${percentage}%
                    </div>
                    <h2 class="text-xl font-bold text-slate-900">${badgeText}</h2>
                    <p class="text-xs text-slate-500 mt-1">${selectedClass} | Set ${cleanNum}</p>

                    <div class="grid grid-cols-2 gap-3 mt-6 pt-6 border-t border-slate-100">
                        <div class="bg-slate-50 p-4 rounded-2xl">
                            <span class="text-xs text-slate-400 block font-semibold uppercase tracking-wider mb-1">Total Marks</span>
                            <span class="text-2xl font-black text-emerald-600">${score} <span class="text-sm font-bold text-slate-400">/ ${total}</span></span>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-2xl">
                            <span class="text-xs text-slate-400 block font-semibold uppercase tracking-wider mb-1">Max Streak</span>
                            <span class="text-2xl font-black text-amber-500">${maxStreakAchieved}</span>
                        </div>
                    </div>
                </div>
            `;

            let incorrectQuestions = [];
            currentQuestions.forEach((q, idx) => {
                let userAns = userAnswers[idx];
                if (userAns !== q.correctAnswer) {
                    incorrectQuestions.push({ q, idx, userAns });
                }
            });

            if (incorrectQuestions.length > 0) {
                html += `
                    <div class="mb-4">
                        <h3 class="font-bold text-slate-900 text-base">Incorrect Answers Review</h3>
                        <p class="text-xs text-slate-500 mt-0.5">Review the questions you missed below:</p>
                    </div>
                    <div class="space-y-4 mb-6">
                `;

                incorrectQuestions.forEach(item => {
                    let { q, idx, userAns } = item;
                    let correctAnsKey = q.correctAnswer;
                    let correctAnsText = q.options[correctAnsKey];
                    let userAnsText = userAns ? q.options[userAns] : 'Not Answered';

                    html += `
                        <div class="bg-white p-4 rounded-2xl border border-rose-200 bg-rose-50/20 shadow-sm">
                            <div class="flex items-start justify-between mb-2">
                                <span class="text-[11px] font-bold text-slate-400">Q${idx + 1}</span>
                                <span class="text-[10px] font-bold bg-rose-100 text-rose-700 px-2 py-0.5 rounded-full">Incorrect</span>
                            </div>
                            <h4 class="font-semibold text-slate-900 text-sm mb-3">${q.questionText}</h4>
                            
                            <div class="space-y-1.5 text-xs">
                                <div class="p-2 rounded-xl bg-slate-50 text-slate-600">
                                    <span class="font-semibold">Your Answer:</span> ${userAns ? userAns + ': ' + userAnsText : '<span class="italic text-slate-400">Not Answered</span>'}
                                </div>
                                <div class="p-2 rounded-xl bg-emerald-50 text-emerald-800">
                                    <span class="font-semibold">Correct Answer:</span> ${correctAnsKey}: ${correctAnsText}
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            } else {
                html += `
                    <div class="bg-emerald-50 border border-emerald-200 p-5 rounded-3xl text-center mb-6">
                        <h3 class="font-bold text-emerald-900 text-sm">Flawless Performance</h3>
                        <p class="text-xs text-emerald-700 mt-1">You answered every question correctly. Amazing job!</p>
                    </div>
                `;
            }

            html += `
                <div class="space-y-3">
                    <button onclick="renderNameInputView()" class="w-full bg-brand-600 text-white font-semibold py-3.5 rounded-2xl text-sm shadow-lg shadow-brand-500/25 active:scale-[0.98] transition-transform">
                        Retake Set
                    </button>
                    <button onclick="renderSetsView()" class="w-full bg-white border border-slate-200 text-slate-700 font-semibold py-3.5 rounded-2xl text-sm active:scale-[0.98] transition-transform">
                        Choose Another Set
                    </button>
                </div>
            `;
            document.getElementById('view-container').innerHTML = html;
        }

        window.onload = loadData;
    </script>
</body>
</html>
